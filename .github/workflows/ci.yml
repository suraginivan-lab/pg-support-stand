name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (Bash)
        run: shellcheck -x -S warning scripts/bash/*.sh docker/postgres/replica-entrypoint.sh docker/ad/entrypoint.sh sql/init/01_roles.sh
      - name: Ruff (Python)
        run: pipx run ruff check python
      - name: PSScriptAnalyzer (PowerShell)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts/powershell -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table; if ($r | Where-Object Severity -eq 'Error') { exit 1 }
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          Invoke-Pester -Path scripts/powershell -CI
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: docker/postgres/Dockerfile }
      - name: Валидность compose
        run: cp .env.example .env && docker compose --profile ad --profile tools config -q

  test-sql-python:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: shop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: shop
      POSTGRES_USER: postgres
      POSTGRES_DB: shop
      APP_RW_PASSWORD: ci
      APP_RO_PASSWORD: ci
      REPLICATOR_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Применить схему и данные
        run: |
          bash sql/init/01_roles.sh
          for f in sql/init/0[234]*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: "Диагностические SQL (кроме 03 — нужен preload pg_stat_statements) выполняются без ошибок"
        run: for f in sql/diagnostics/0[1,2,4,5,6,7]*.sql; do psql -v ON_ERROR_STOP=1 -f "$f" > /dev/null; done
      - name: Pytest
        run: pytest -v
      - name: Бэкап + проверка восстановления
        run: |
          f=$(scripts/bash/backup.sh /tmp/bk | tail -1)
          scripts/bash/restore_check.sh "$f"

  smoke-compose:
    runs-on: ubuntu-latest
    needs: test-sql-python
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Поднять стенд (dns + primary + replica)
        run: docker compose up -d --build --wait
      - name: Проверка репликации и DNS
        run: |
          docker compose --profile tools run --rm -e REPLICA_HOST=pg-replica -e DNS_NAMES="pg-rw.lab.local pg-ro.lab.local" \
            toolbox bash scripts/bash/healthcheck.sh
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - run: docker compose down -v

  publish:                      # CD: по тегу vX.Y.Z публикуем образы в GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: smoke-compose
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          push: true
          tags: ghcr.io/${{ github.repository }}/postgres:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/toolbox/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/toolbox:${{ github.ref_name }}
