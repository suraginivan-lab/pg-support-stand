# TYPE  DATABASE     USER        ADDRESS         METHOD
local   all          postgres                    trust
local   all          all                         scram-sha-256
host    replication  replicator  172.28.0.0/24   scram-sha-256
# доменные учётные записи (члены роли ad_users) проверяются в Active Directory по LDAP.
# Работает только при запущенном профиле "ad". Пароль уходит в открытом виде -> в проде только ldaps/GSSAPI.
host    all          +ad_users   172.28.0.0/24   ldap ldapserver=dc1.lab.local ldapsuffix="@lab.local"
host    all          all         172.28.0.0/24   scram-sha-256
host    all          all         0.0.0.0/0       scram-sha-256
